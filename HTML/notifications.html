<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="../CSS/style.css">
</head>

<body>
    <div class="card">
        <h2>Notifications</h2>

        <div class="notif-item">
            <div class="notif-icon icon-orange"><i class="fa-solid fa-box"></i></div>
            <div class="notif-text">
                <p>Your issue <strong>CF109</strong> has been assigned to Electrical Department.</p>
                <span>5 min ago</span>
            </div>
            <i class="fa-solid fa-chevron-right chevron"></i>
        </div>

        <div class="notif-item">
            <div class="notif-icon icon-green"><i class="fa-solid fa-check"></i></div>
            <div class="notif-text">
                <p>Your issue <strong>CF102</strong> has been resolved.</p>
                <span>2 hours ago</span>
            </div>
            <i class="fa-solid fa-chevron-right chevron"></i>
        </div>

        <div class="notif-item">
            <div class="notif-icon icon-red"><i class="fa-solid fa-triangle-exclamation"></i></div>
            <div class="notif-text">
                <p>Please verify the resolution for issue <strong>CF102</strong>.</p>
                <span>2 hours ago</span>
            </div>
            <i class="fa-solid fa-chevron-right chevron"></i>
        </div>

        <a href="notifications.html" class="view-all">View All Notifications</a>
    </div>
    <script src="../JavaScript/script.js"></script>
</body>

</html>
