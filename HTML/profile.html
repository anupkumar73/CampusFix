<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="../CSS/style.css">
</head>

<body>
    <div class="profile-card">
        <div class="profile-top">
            <div class="profile-left">
                <div class="user-header">
                    <div class="avatar">
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <div class="user-main">
                        <h3>Anup Kumar</h3>
                        <span class="user-id">2026CSE001</span>
                    </div>
                </div>

                <div class="info-list">
                    <div class="info-row">
                        <span class="info-label">Course</span>
                        <span class="info-value">B.Tech CSE</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Semester</span>
                        <span class="info-value">5th</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Email</span>
                        <span class="info-value">anup@college.edu</span>
                    </div>
                </div>
            </div>

            <div class="stats-box">
                <div class="stat-row1">
                    <span class="stat-label">Reports Submitted</span>
                    <span class="stat-value">0</span>
                </div>
                <div class="stat-divider"></div>
                <div class="stat-row1">
                    <span class="stat-label">Issues Supported</span>
                    <span class="stat-value">0</span>
                </div>
                <div class="stat-divider"></div>
                <div class="stat-row1">
                    <span class="stat-label">Issues Resolved</span>
                    <span class="stat-value">0</span>
                </div>
            </div>
        </div>

        <div class="profile-actions">
            <button class="btn-outline" id="editProfileBtn">Edit Profile</button>
            <button class="btn-outline" id="changePasswordBtn">Change Password</button>
        </div>
    </div>

    <script src="../JavaScript/script.js"></script>
</body>

</html>
