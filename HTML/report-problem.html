<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusFix | Report a Campus Problem</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/CSS/style.css" />

</head>
<body>
    <div class="Report-Container">
        <h2>Report a Campus Problem</h2>
        <form action="report-problem.html" method="post">
            <label for="problem-title">Problem Title:</label>
            <input type="text" id="problem-title" name="problem-title" placeholder="Enter the problem title" required><br><br>

            <label for="problem-description">Problem Description:</label>
            <textarea id="problem-description" name="problem-description" placeholder="Describe the problem in detail" required></textarea><br><br>

            <label for="Category">Category (Smart Suggestion):</label>
            <select id="Category" name="Category" required>
                <option value="">Select a category</option>
                <option value="maintenance">Maintenance</option>
                <option value="safety">Safety</option>
                <option value="cleanliness">Cleanliness</option>
                <option value="Electrical">Electrical</option>
                <option value="other">Other</option>
            </select><br><br>

            <label for="location">Location:</label>
            <input type="text" id="location" name="location" placeholder="Enter the location of the problem" required><br><br>

            <label for="image-upload">Upload Image (optional):</label>
            <input type="file" id="image-upload" name="image-upload">
            <input type="file" id="image-upload" name="image-upload"><br><br>

            <button type="submit">Submit Report</button>
        </form>
    </div>
    
</body>
</html>
