<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Forgot Password | CampusFix">
        <link rel="stylesheet" href="../CSS/style.css">
</head>

<body>
    <div class="card">
        <h2>Forgot Password</h2>
        <div class="subtitle">Enter your registered email or student ID to reset your password.</div>
        <form
            onsubmit="event.preventDefault(); alert('Password reset instructions sent.'); window.location.href='login.html';">
            <label>Student ID / Email</label><input type="text" required
                placeholder="Enter your student ID or email"><br><br><button class="btn-primary1" type="submit">Reset
                Password</button></form>
        <p style="text-align:center;margin-top:15px"><a href="login.html">Back to Login</a></p>
    </div>
</body>

</html>
