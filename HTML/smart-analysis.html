<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Analysis</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="../CSS/style.css">
</head>

<body>
    <div class="card">
        <h2>Smart Analysis</h2>
        <div class="subtitle">Our system has analyzed your problem.</div>
        <div class="divider"></div>

        <div class="field-group">
            <div class="field-label">Category</div>
            <div class="field-value">Electrical</div>
        </div>
        <div class="divider"></div>

        <div class="field-group">
            <div class="field-label">Location</div>
            <div class="field-value">Academic Block, 2nd Floor, CSE Lab 2</div>
        </div>
        <div class="divider"></div>

        <div class="field-group">
            <div class="field-label">Priority</div>
            <div class="field-value"><span class="dot dot-red"></span> Critical</div>
        </div>
        <div class="divider"></div>

        <div class="field-group">
            <div class="field-label">Assigned Department</div>
            <div class="field-value"><i class="fa-solid fa-gear" style="font-size:11px; color:#4b5563;"></i> Electrical
                Maintenance</div>
        </div>
        <div class="divider"></div>

        <div class="subtitle" style="margin-top: 8px; margin-bottom: 12px;">Please confirm the details before
            submitting.</div>
        <button class="btn-primary1" id="confirmBtn">Confirm & Submit</button>
    </div>
    <script src="../JavaScript/script.js"></script>
</body>

</html>
