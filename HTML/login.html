<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login | CampusFix</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/CSS/login.css">
    <link rel="stylesheet" href="/CSS/style.css">
</head>

<body>
    <div class="login-container">
        <h1>CampusFix</h1>
        <h3>Student Login</h3>
        <form action="dashboard.html" id="loginForm" method="post">
            <label for="username">Student ID or Email ID</label><br>
            <input type="text" id="username" name="username" placeholder="Enter your student ID or email ID"
                required><br><br>

            <label for="password">Password</label><br>
            <input type="password" id="password" name="password" placeholder="Enter your password" required><br><br>

                <input type="checkbox" id="Remember-me" name="Remember-me">
                <label for="Remember-me" class="form-label">Remember me</label>

                <a href="forget-password.html" class="for-pass">Forget Password?</a>

                <br><br>

            <button type="submit">Login</button>
        </form>
        <p>Don't have an account? <a href="Contact-Admin.html" class="contact-admin">Contact Admin</a></p>
    </div>

</body>

</html>
