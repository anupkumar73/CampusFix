<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submitted Successfully</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="../CSS/style.css">
</head>

<body>
    <div class="card success-card">
        <div class="success-icon">
            <i class="fa-solid fa-check"></i>
        </div>
        <div class="success-title">Report Submitted Successfully!</div>

        <div class="id-box">
            <div class="id-label">Complaint ID</div>
            <div class="id-number">CF109</div>
        </div>

        <div class="subtitle" style="margin-bottom: 4px;">Your issue has been automatically assigned to:</div>
        <div class="field-value" style="margin-bottom: 12px; font-size:14px;">Electrical Department</div>

        <div class="subtitle" style="margin-bottom: 4px;">Priority: <span class="dot dot-red"></span>
            <strong>Critical</strong>
        </div>
        <div class="subtitle" style="margin-bottom: 16px;">Expected Response: <strong>Within 2 Hours</strong></div>

        <button class="btn-primary1" id="trackBtn">Track Issue</button>
        <button class="btn-secondary1" onclick="window.location.href='feedback.html'">Give Feedback</button>
    </div>
    <script src="../JavaScript/script.js"></script>
</body>

</html>
