<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Complaint Details & Tracking</title><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"><link rel="stylesheet" href="../CSS/style.css"><style>
body{background:#f6f9fc}.tracking-card{max-width:760px!important}.back{display:inline-block;margin-bottom:12px;color:#1d4ed8;text-decoration:none}.detail-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.badge{padding:5px 10px;border-radius:20px;background:#fee2e2;color:#b91c1c;font-size:12px;font-weight:700}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.detail-cell{padding:12px;border:1px solid #e5e7eb;border-radius:10px}.detail-cell small{display:block;color:#64748b;margin-bottom:4px}.timeline{margin-top:18px}.timeline-row{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #eef2f7}.timeline-dot{width:12px;height:12px;border-radius:50%;background:#159447;margin-top:5px;flex:0 0 12px}.timeline-row small{color:#64748b}.@media(max-width:600px){.detail-grid{grid-template-columns:1fr}}
</style></head><body><div class="card tracking-card"><a class="back" href="my-reports.html">← Back to My Reports</a><div class="detail-head"><h2 id="detailTicket">Complaint</h2><span class="badge" id="detailStatus">Loading</span></div><h3 id="detailTitle" style="margin-top:18px">Loading...</h3><div class="detail-grid"><div class="detail-cell"><small>Location</small><span id="detailLocation">—</span></div><div class="detail-cell"><small>Department</small><span id="detailDepartment">—</span></div><div class="detail-cell"><small>Priority</small><span id="detailPriority">—</span></div></div><h3>Status Tracking</h3><div class="timeline" id="detailTimeline"></div><button class="btn-primary1" id="verifyBtn" style="margin-top:16px">Waiting for Resolution</button><button class="btn-secondary1" onclick="location.href='feedback.html'" style="margin-top:8px">Give Feedback</button></div><script src="../JavaScript/script.js"></script></body></html>
